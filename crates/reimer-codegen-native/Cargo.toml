[package]
name = "reimer-codegen-native"
description = "Cranelift native-code backend for Reimer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cranelift-codegen = { version = "0.134.2", default-features = false, features = ["host-arch", "std"] }
cranelift-frontend = "0.134.2"
cranelift-jit = "0.134.2"
cranelift-module = "0.134.2"
cranelift-native = "0.134.2"
cranelift-object = { version = "0.134.2", default-features = false }
libloading = "0.9.0"
reimer-diagnostics = { path = "../reimer-diagnostics" }
reimer-hir = { path = "../reimer-hir" }
reimer-layout = { path = "../reimer-layout" }
reimer-runtime = { path = "../reimer-runtime" }
reimer-types = { path = "../reimer-types" }

[dev-dependencies]
reimer-lexer = { path = "../reimer-lexer" }
reimer-parser = { path = "../reimer-parser" }
reimer-resolver = { path = "../reimer-resolver" }

[lints]
workspace = true
