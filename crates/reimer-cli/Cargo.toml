[package]
name = "reimer-cli"
description = "Command-line compiler and build tool for Reimer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "reimer"
path = "src/main.rs"

[dependencies]
reimer-codegen-native = { path = "../reimer-codegen-native" }
reimer-diagnostics = { path = "../reimer-diagnostics" }
reimer-hir = { path = "../reimer-hir" }
reimer-lexer = { path = "../reimer-lexer" }
reimer-lint = { path = "../reimer-lint" }
reimer-package = { path = "../reimer-package" }
reimer-parser = { path = "../reimer-parser" }
reimer-project = { path = "../reimer-project" }
reimer-resolver = { path = "../reimer-resolver" }

[lints]
workspace = true
