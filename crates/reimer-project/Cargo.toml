[package]
name = "reimer-project"
description = "Declarative manifest, lockfile, and dependency graph support for Reimer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
reimer-package = { path = "../reimer-package" }
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
thiserror = "2.0"
toml = "0.9"

[dev-dependencies]
reimer-codegen-native = { path = "../reimer-codegen-native" }
reimer-resolver = { path = "../reimer-resolver" }

[lints]
workspace = true
