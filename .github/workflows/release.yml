name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Resolve release tag
        id: tag
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if ($env:REQUESTED_TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?$') {
            throw "Release tag '$env:REQUESTED_TAG' must be a SemVer value prefixed with 'v'."
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "tag=$env:REQUESTED_TAG"

      - name: Record validated release commit
        id: commit
        shell: pwsh
        run: |
          $commit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $commit -notmatch '^[0-9a-f]{40}$') {
            throw 'Could not resolve the checked-out release commit.'
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "sha=$commit"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          components: clippy, rustfmt

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Validate tag and package versions
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: ./scripts/release/verify-tag.ps1 -Tag $env:RELEASE_TAG

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Run strict Clippy checks
        run: >-
          cargo clippy --workspace --all-targets --all-features --locked --
          -W clippy::perf
          -W clippy::redundant_clone
          -W clippy::needless_collect
          -D warnings

  build:
    name: Package ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            host: x86_64-unknown-linux-gnu
            suffix: ""
          - name: linux-arm64
            os: ubuntu-24.04-arm
            host: aarch64-unknown-linux-gnu
            suffix: ""
          - name: windows-x64
            os: windows-latest
            host: x86_64-pc-windows-msvc
            suffix: .exe
          - name: macos-x64
            os: macos-15-intel
            host: x86_64-apple-darwin
            suffix: ""
          - name: macos-arm64
            os: macos-15
            host: aarch64-apple-darwin
            suffix: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Verify native host
        shell: pwsh
        run: |
          $hostLine = rustc -vV | Select-String '^host:'
          $actualHost = $hostLine.ToString().Substring(5).Trim()
          if ($actualHost -ne '${{ matrix.host }}') {
            throw "runner host '$actualHost' does not match '${{ matrix.host }}'"
          }

      - name: Build release tools
        run: >-
          cargo build --release --locked
          -p reimer-cli
          -p reimer-lsp
          -p reimer-lint

      - name: Smoke-test release compiler
        shell: pwsh
        run: |
          $compiler = (Resolve-Path "target/release/reimer${{ matrix.suffix }}").Path
          $program = Join-Path $env:RUNNER_TEMP "exit_42${{ matrix.suffix }}"
          & $compiler check examples/exit_42.reim
          if ($LASTEXITCODE -ne 0) { throw 'release compiler check failed' }
          & $compiler build examples/exit_42.reim --release -o $program
          if ($LASTEXITCODE -ne 0) { throw 'release compiler build failed' }
          & $program
          if ($LASTEXITCODE -ne 42) {
            throw "native smoke test returned $LASTEXITCODE instead of 42"
          }
          $global:LASTEXITCODE = 0

      - name: Package release archive
        id: package
        shell: pwsh
        run: >-
          ./scripts/release/package.ps1
          -Version '${{ needs.validate.outputs.version }}'
          -TargetHost '${{ matrix.host }}'

      - name: Smoke-test packaged layout
        shell: pwsh
        run: |
          $archive = (Resolve-Path '${{ steps.package.outputs.archive }}').Path
          $unpackRoot = Join-Path $env:RUNNER_TEMP 'reimer-package-smoke-${{ matrix.name }}'
          New-Item -ItemType Directory -Path $unpackRoot | Out-Null

          if ($archive.EndsWith('.zip')) {
            Expand-Archive -LiteralPath $archive -DestinationPath $unpackRoot
          } else {
            & tar -C $unpackRoot -xzf $archive
            if ($LASTEXITCODE -ne 0) { throw 'release archive extraction failed' }
          }

          $packageName = 'reimer-v${{ needs.validate.outputs.version }}-${{ matrix.host }}'
          $compiler = Join-Path $unpackRoot "$packageName/reimer${{ matrix.suffix }}"
          & $compiler --version
          if ($LASTEXITCODE -ne 0) { throw 'packaged compiler did not start' }
          & $compiler check examples/m3_time.reim
          if ($LASTEXITCODE -ne 0) {
            throw 'packaged compiler could not resolve its standard library'
          }
          $source = Join-Path $unpackRoot 'native-smoke.reim'
          $program = Join-Path $unpackRoot 'native-smoke${{ matrix.suffix }}'
          Set-Content -LiteralPath $source -Encoding utf8 -Value 'fn main() -> i32 { 42 }'
          & $compiler build $source --release -o $program
          if ($LASTEXITCODE -ne 0) { throw 'packaged compiler could not build an executable' }
          & $program
          if ($LASTEXITCODE -ne 42) {
            throw "packaged native smoke test returned $LASTEXITCODE instead of 42"
          }
          $global:LASTEXITCODE = 0

      - name: Install Node.js for VS Code package
        if: runner.os == 'Windows'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Package VS Code extension
        if: runner.os == 'Windows'
        working-directory: editors/vscode
        run: |
          npm ci
          npm test
          npm run package

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.name }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload VS Code extension
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-vscode
          path: editors/vscode/*.vsix
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.release.outputs.url }}
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub Release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath release-assets -File | Sort-Object Name)
          if ($assets.Count -eq 0) { throw 'no release assets were downloaded' }

          $reference = & gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'release tag lookup failed' }
          $object = $reference.object
          while ($object.type -eq 'tag') {
            $tagObject = & gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($object.sha)" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'annotated release tag lookup failed' }
            $object = $tagObject.object
          }
          if ($object.type -ne 'commit' -or $object.sha -ne $env:RELEASE_COMMIT) {
            throw "Release tag '$env:RELEASE_TAG' no longer identifies validated commit '$env:RELEASE_COMMIT'."
          }

          $repository = $env:GITHUB_REPOSITORY
          $releaseEndpoint = "repos/$repository/releases/tags/$env:RELEASE_TAG"
          $existingRelease = & gh api $releaseEndpoint 2>$null
          if ($LASTEXITCODE -eq 0) {
            $arguments = @(
              'release', 'upload', $env:RELEASE_TAG,
              '--repo', $repository,
              '--clobber'
            )
            $arguments += $assets.FullName
            & gh @arguments
            if ($LASTEXITCODE -ne 0) { throw 'GitHub Release asset upload failed' }
          } else {
            $arguments = @(
              'release', 'create', $env:RELEASE_TAG,
              '--repo', $repository,
              '--target', $env:RELEASE_COMMIT,
              '--generate-notes',
              '--title', "Reimer $env:RELEASE_TAG"
            )
            $arguments += $assets.FullName
            & gh @arguments
            if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed' }
          }

          $release = & gh api $releaseEndpoint | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($release.html_url)) {
            throw 'Published GitHub Release could not be inspected'
          }

          $publishedAssets = @($release.assets)
          $publishedNames = @($publishedAssets | ForEach-Object { $_.name })
          $missingAssets = @($assets | Where-Object { $_.Name -notin $publishedNames })
          if ($missingAssets.Count -ne 0) {
            $missingNames = ($missingAssets.Name | Sort-Object) -join ', '
            throw "GitHub Release is missing expected assets: $missingNames"
          }

          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "url=$($release.html_url)"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## Reimer $env:RELEASE_TAG"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ''
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "[Open the GitHub Release]($($release.html_url))"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ''
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '### Build downloads'
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ''
          foreach ($asset in $publishedAssets | Sort-Object name) {
            if ($asset.name -in $assets.Name) {
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- [$($asset.name)]($($asset.browser_download_url))"
            }
          }
          Write-Output "::notice title=GitHub Release::$($release.html_url)"
